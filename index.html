<!doctype html>
<html lang="en" data-theme="meadow" data-face="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hojas · Read Spanish</title>
<meta name="description" content="Read Spanish books, tap any word for its meaning, and build a vocabulary list as you go.">
<meta name="theme-color" content="#0f9d76">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Library -->
  <section id="view-library" class="view">
    <header class="hero">
      <div class="fireflies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="hero-row">
        <div>
          <h1 class="wordmark">Hojas</h1>
          <p class="tagline">Read Spanish. Tap a word.</p>
        </div>
        <button id="btn-install" class="pill ghost" hidden>Install</button>
      </div>
      <svg class="wave" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22 C60 4 110 40 200 22 C290 4 340 38 400 18 L400 40 L0 40Z"/></svg>
    </header>
    <main class="shelf-wrap">
      <button id="btn-import" class="btn-primary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Import Book</span></button>
      <p class="hint">PDF or EPUB · stays on this phone</p>
      <div id="shelf" class="shelf"></div>
    </main>
  </section>

  <!-- Vocabulary -->
  <section id="view-vocab" class="view" hidden>
    <header class="page-head">
      <h2>Vocabulary</h2>
      <p id="vocab-summary" class="sub"></p>
    </header>
    <div class="vocab-tools">
      <div id="vocab-books" class="chips"></div>
      <div class="row">
        <input id="vocab-search" type="search" placeholder="Search words or meanings" autocomplete="off" autocapitalize="off" spellcheck="false">
        <select id="vocab-show" aria-label="Show">
          <option value="all">All</option>
          <option value="todo">To learn</option>
          <option value="learned">Learned</option>
          <option value="phrases">Phrases</option>
        </select>
        <select id="vocab-sort" aria-label="Sort words">
          <option value="recent">Recent</option>
          <option value="count">Most looked up</option>
          <option value="az">A–Z</option>
        </select>
      </div>
    </div>
    <div id="vocab-list" class="vocab-list"></div>
  </section>

  <!-- Review -->
  <section id="view-review" class="view" hidden>
    <header class="page-head">
      <h2>Review</h2>
      <p id="rv-sub" class="sub"></p>
    </header>
    <div id="rv-home" class="rv-home"></div>
    <div id="rv-run" class="rv-run" hidden></div>
  </section>

  <!-- Reader -->
  <section id="view-reader" class="view reader" hidden>
    <header class="reader-top">
      <button id="r-back" class="icon-btn" aria-label="Back to library"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="r-title"><b id="r-book"></b><span id="r-sec"></span></div>
      <button id="r-vocab" class="icon-btn" aria-label="Vocabulary for this book"><svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 9h8M8 13h8M8 17h5"/></svg><em id="r-vcount"></em></button>
      <button id="r-toc" class="icon-btn" aria-label="Contents"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button id="r-aa" class="icon-btn aa" aria-label="Reading settings">Aa</button>
      <div class="r-progress"><div id="r-bar"></div></div>
    </header>
    <div id="r-scroll" class="r-scroll">
      <article id="r-text" class="text"></article>
    </div>
  </section>

  <nav id="tabs" class="tabs" aria-label="Main">
    <button data-tab="library" class="on"><svg viewBox="0 0 24 24"><path d="M5 4h4v16H5zM10.5 6h4v14h-4zM16 5.4l3.8-1 3 14.6-3.8 1z"/></svg><span>Library</span></button>
    <button data-tab="vocab"><svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM8 9h8M8 13h8M8 17h5"/></svg><span>Words</span></button>
    <button data-tab="review"><svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="14" height="12" rx="2.5"/><path d="M7 7V5.5A1.5 1.5 0 0 1 8.5 4h10A2.5 2.5 0 0 1 21 6.5V15a1.5 1.5 0 0 1-1.5 1.5H17.5"/></svg><span>Review</span></button>
  </nav>

  <!-- Word popup -->
  <div id="pop" class="pop" hidden role="dialog" aria-live="polite"></div>

  <!-- Sheets -->
  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="sheet-toc" class="sheet" hidden>
    <div class="grip"></div>
    <h3>Contents</h3>
    <ol id="toc-list" class="toc"></ol>
  </aside>
  <aside id="sheet-set" class="sheet" hidden>
    <div class="grip"></div>
    <h3>Reading</h3>
    <label class="set-row"><span>Text size</span>
      <input id="set-size" type="range" min="16" max="30" step="1">
    </label>
    <div class="set-row"><span>Typeface</span>
      <div class="seg" id="set-face"><button data-v="serif">Serif</button><button data-v="sans">Sans</button></div>
    </div>
    <div class="set-row"><span>Page</span>
      <div class="seg" id="set-theme"><button data-v="meadow">Meadow</button><button data-v="sky">Sky</button><button data-v="night">Night</button></div>
    </div>
  </aside>

  <dialog id="confirm" class="confirm">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button value="cancel" class="pill ghost">Cancel</button>
        <button value="ok" class="pill danger">Remove</button>
      </div>
    </form>
  </dialog>

  <div id="busy" class="busy" hidden>
    <div class="busy-card">
      <div class="spinner"></div>
      <b id="busy-title">Opening book</b>
      <span id="busy-text"></span>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<input id="file" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" hidden>
<script src="vendor/jszip.min.js"></script>
<script src="app.js" type="module"></script>
</body>
</html>
