<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4ecfa"/>
      <stop offset=".48" stop-color="#52d3b2"/>
      <stop offset="1" stop-color="#0b8a67"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".36" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df0c4"/>
      <stop offset="1" stop-color="#0f9d76"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6f5d9"/>
      <stop offset="1" stop-color="#14a97f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3f9f1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="196" r="190" fill="url(#glow)"/>

  <!-- soft hills -->
  <path d="M0 430 C110 392 190 408 256 420 C330 432 420 396 512 424 L512 512 L0 512Z" fill="#0a7a5b" opacity=".45"/>

  <g transform="translate(256 266) scale(.86) translate(-256 -256)">
    <!-- seedling -->
    <path d="M256 300 C256 262 254 226 256 184" fill="none" stroke="#0b7f5f" stroke-width="9" stroke-linecap="round"/>
    <path d="M256 214 C214 222 176 196 164 150 C212 146 252 168 256 214Z" fill="url(#leaf)"/>
    <path d="M256 190 C292 192 332 164 342 118 C298 116 260 142 256 190Z" fill="url(#leaf2)"/>
    <path d="M256 214 C232 196 208 178 180 160" fill="none" stroke="#e9fff6" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
    <path d="M256 190 C280 168 306 146 330 128" fill="none" stroke="#e9fff6" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>

    <!-- book shadow -->
    <ellipse cx="256" cy="414" rx="168" ry="16" fill="#064d3a" opacity=".28"/>

    <!-- page stack edge -->
    <path d="M92 372 C150 356 214 362 256 392 C298 362 362 356 420 372 L420 392 C362 376 298 382 256 412 C214 382 150 376 92 392Z" fill="#9fe6cf"/>
    <!-- pages -->
    <path d="M256 392 C214 360 150 352 92 368 L92 262 C150 246 214 254 256 286Z" fill="url(#page)"/>
    <path d="M256 392 C298 360 362 352 420 368 L420 262 C362 246 298 254 256 286Z" fill="url(#page)"/>
    <path d="M256 286 L256 392" stroke="#7ad9bb" stroke-width="5" stroke-linecap="round"/>
    <!-- text lines -->
    <g stroke="#7ad9bb" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M124 296 C158 288 198 292 226 308"/>
      <path d="M124 324 C158 316 198 320 226 336"/>
      <path d="M288 308 C316 292 356 288 388 296"/>
    </g>
    <!-- highlighted word on the right page -->
    <path d="M288 336 C316 320 346 318 366 322" stroke="#4cc3e6" stroke-width="16" stroke-linecap="round" fill="none" opacity=".75"/>
    <path d="M288 336 C316 320 346 318 366 322" stroke="#0f9d76" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="1 9"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M118 120 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z" opacity=".95"/>
    <path d="M404 150 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" opacity=".9"/>
    <path d="M372 84 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5z" opacity=".75"/>
    <circle cx="160" cy="214" r="5" opacity=".8"/>
    <circle cx="438" cy="236" r="4" opacity=".7"/>
  </g>
</svg>
